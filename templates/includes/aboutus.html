    <section class="contact-section">
        <div class="contact-header">
            <h1>Get in Touch</h1>
            <p>For inquiries, bookings, or support, reach out to us anytime.</p>
        </div>

        <div class="contact-content">
            <h2>Review Box</h2>
            <form action="#" method="post" class="contact-form">
                <div class="form-group">
                    <label for="fname">First Name</label>
                    <input type="text" id="fname" name="name" required placeholder="Enter your first name">
                </div>

                <div class="form-group">
                    <label for="lname">Last Name</label>
                    <input type="text" id="lname" name="name" required placeholder="Enter your last name">
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required placeholder="Enter your email">
                </div>
                

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" required placeholder="Enter your phone number">
                </div>

                <div class="form-group-message" id="message">
                    <label for="messages">Message</label>
                    <textarea id="messages" name="message" rows="5" required placeholder="Write your message here"></textarea>
                </div>
                <br>

                <button type="submit" class="submit-button">Send Message</button>
            </form>

            <div class="contact-info">
                <h2>Party Palace Booking Office</h2>
               
                    <div class="details">
                        <div class="row">
                            <div class="address-icon">
                                <i class="fa-solid fa-location-dot"></i>
                                <h5>Address</h5>
                                Radhe-radhe, <br>Bhaktapur, Nepal
                            </div>
                            <div class="opening-icon">
                                <i class="fa-solid fa-clock"></i>
                                <h5>Opening Hours</h5>
                                Sun to Fri : 10 AM - 6 PM <br>
                                Saturday: Closed
                            </div>
                            <div class="contact-icon">
                                <i class="fa fa-phone"></i>
                                <h5>Contact no.</h5>
                                9765834001
                            </div>
                            <div class="email-icon">
                                <i class="fa-regular fa-envelope"></i>
                                <h5>Email Us</h5>
                                venuehub@gmail.com
                            </div>
                        
                    </div>
            </div>
                    
    </section>
